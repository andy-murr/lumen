{% extends "base.html" %}
{% block title %}Enter confirmation code{% endblock %}
{% block content %}
<h1 class="h3 mt-3">Enter confirmation code</h1>
<p>Type the code shown by the application that is requesting a Lumen API key.</p>
<form method="get" action="{{ url_for('oauth.device_page') }}" class="mb-4">
  <div class="mb-2" style="max-width: 16rem">
    <label for="code" class="form-label">Confirmation code</label>
    <input class="form-control" id="code" name="code" required autocomplete="off"
           pattern="[A-Za-z0-9][A-Za-z0-9-]{6,9}" placeholder="BCDF-GHJK">
  </div>
  <button type="submit" class="btn btn-primary">Continue</button>
</form>
{% endblock %}
